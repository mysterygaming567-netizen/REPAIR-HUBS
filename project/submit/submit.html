<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit a repair — RepairHub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand">R</div>
      <div class="nav-links">
        <a href="../dashboard/dashboard.html">Dashboard</a>
        <a href="../find/find.html">Find repairman</a>
        <a class="active" href="../submit/submit.html">Submit repair</a>
        <a href="../myrepairs/myrepairs.html">My repairs</a>
      </div>
      <div class="spacer"></div>
      <div class="profile" id="profileName">User</div>
      <a href="#" id="logoutLink" class="logout">Log out</a>
    </div>
  </header>

  <main>
    <section class="submit">
      <div class="container">
        <h1>Submit a repair request</h1>
        <p class="sub">Tell us what's wrong and we'll match you with a verified technician.</p>

        <form id="submitForm" class="submit-card">
          <label class="label" for="device">DEVICE TYPE</label>
          <input id="device" placeholder="Smartphone — Samsung Galaxy S22" required>

          <label class="label" for="media">UPLOAD MEDIA</label>
          <label class="upload" id="upload" for="media">Add photos, videos, or a PDF of the issue<span>Accepted: JPG, PNG, MP4, PDF · up to 10 MB</span></label>
          <input id="media" type="file" accept="image/*,video/*,.pdf" multiple hidden>

          <label class="label" for="description">DESCRIBE THE ISSUE</label>
          <textarea id="description" rows="4" placeholder="Describe the problem..." required>Cracked screen, touch not responding on the lower half</textarea>

          <label class="label">PREFERRED DEADLINE</label>
          <div class="deadline-row">
            <select id="deadline"><option>Within 3 days</option><option>Within a week</option><option>Flexible</option></select>
            <button type="submit" id="submitBtn" class="btn primary">Submit request</button>
          </div>
          <div id="submitResult" class="result"></div>
        </form>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
