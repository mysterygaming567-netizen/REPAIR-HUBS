<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a repairman — RepairHub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand">R</div>
      <div class="nav-links">
        <a href="../dashboard/dashboard.html">Dashboard</a>
        <a class="active" href="../find/find.html">Find repairman</a>
        <a href="../submit/submit.html">Submit repair</a>
        <a href="../myrepairs/myrepairs.html">My repairs</a>
      </div>
      <div class="spacer"></div>
      <div class="profile" id="profileName">User</div>
      <a href="#" id="logoutLink" class="logout">Log out</a>
    </div>
  </header>

  <main>
    <section class="find">
      <div class="container">
        <h1>Find a repairman</h1>
          <p class="sub">Browse 9 verified shops near Quezon City.</p>

        <div class="search-card">
          <input id="search" placeholder="Search shops or locations...">
          <select id="sort">
            <option value="distance">Nearest first</option>
            <option value="rating">Highest rated</option>
            <option value="verified">Most verified</option>
          </select>
          <div class="category-row" id="categories"></div>
          <label class="open-filter"><input id="openOnly" type="checkbox"> Open now</label>
        </div>

        <div id="shops" class="shops-list"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
